name: Deploy to UAT

on:
  push:
    branches:
      - develop

jobs:
  test_and_deploy_uat:
    name: Verify & Deploy UAT
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: ci_secret_token_key_12345
          FIREBASE_PROJECT_ID: demo-tp-prog4

      - name: Authenticate with Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy UAT Function & Hosting
        run: npx firebase-tools deploy --only functions:apiUat,hosting:uat
