name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: ci_secret_token_key_12345
          FIREBASE_PROJECT_ID: demo-tp-prog4
